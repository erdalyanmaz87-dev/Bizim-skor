<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b315c">
  <title>Şut Yıkım 3D</title>
  <link rel="stylesheet" href="./shot-yikim.css">
</head>
<body>
<main class="shot-yikim">
  <section id="shotYikimMenu" class="shot-yikim__menu">
    <div class="shot-yikim__hero">
      <div class="shot-yikim__logo"><span>Şut</span><strong>Yıkım 3D</strong></div>
      <div class="shot-yikim__hero-ball">⚽</div>
      <div class="shot-yikim__hero-table"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="shot-yikim__menu-card">
      <p class="shot-yikim__eyebrow">Gerçek 3D Futbol Fiziği</p>
      <h1>20 Bölüm</h1>
      <p>Nereye dokunursan top oraya gider. Kuleyi sars, parçaları masanın önünden, arkasından veya yanından yere düşür.</p>
      <button id="shotYikimStart" class="shot-yikim__play" type="button">OYNA</button>
    </div>
  </section>

  <header class="shot-yikim__header">
    <p class="shot-yikim__eyebrow">Futbol Yıkım</p>
    <h2>Şut Yıkım 3D</h2>
    <p id="shotYikimLevelName">1. Bölüm · Isınma</p>
  </header>

  <section class="shot-yikim__hud" aria-label="Oyun bilgileri">
    <div><span>Bölüm</span><strong><b id="shotYikimRound">1</b>/20</strong></div>
    <div><span>Puan</span><strong id="shotYikimScore">0</strong></div>
    <div><span>Top</span><strong id="shotYikimShots">5</strong></div>
  </section>

  <section id="shotYikimBoard" class="shot-yikim__board" role="application" aria-label="3D oyun alanı. Şut çekmek için istediğiniz noktaya dokunun.">
    <div id="shotYikimViewport" class="shot-yikim__viewport"></div>
    <div class="shot-yikim__hint">Kulenin istediğin noktasına dokun ⚽</div>
  </section>

  <p id="shotYikimStatus" class="shot-yikim__status" aria-live="polite">Başlamak için OYNA'ya bas.</p>
  <button id="shotYikimRestart" class="shot-yikim__restart" type="button">Bölümü Tekrarla</button>
</main>
<script src="./shot-yikim-engine.js"></script>
<script type="module" src="./shot-yikim.js"></script>
</body>
</html>
