<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkorBot üçlü araç testi</title><style>
*{box-sizing:border-box}body{margin:0;background:#071633;color:#e2e8f0;font:14px Arial}main{width:min(100%,390px);padding:15px;margin:auto}.hide{display:none!important}button{border:0;border-radius:10px;padding:10px;font-weight:bold;cursor:pointer}nav{display:flex;gap:6px;margin:15px 0}nav button{flex:1;font-size:11px}.m,.champions-match,.nations-match{display:grid;grid-template-columns:minmax(0,1fr) 40px 12px 40px minmax(0,1fr);gap:5px;align-items:center;padding:15px 8px;border:1px solid #304764;border-radius:14px;margin:12px 0;background:#142840}.t{font-size:12px;text-align:center}input{width:40px;padding:10px 1px;text-align:center;border:1px solid #4b6584;border-radius:8px;background:#09172a;color:white;font-size:17px}.match-stats-button{background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd}.small{font-size:12px;color:#c0ccda}#nationsFixtures .nations-match .nations-stats-button{grid-column:1/4!important;width:100%;margin:7px 0 1px;padding:9px 7px;font-size:12px;line-height:1.15}#nationsFixtures .nations-match .robot-prediction-button{grid-column:4/6!important}</style></head><body><main><h2>SkorBot · Üçlü araç kontrolü</h2><p class="small">Örnek verili test ekranı. Gerçek hesaplarla bağlantısı yoktur.</p><nav><button data-kind="super">Süper Lig</button><button data-kind="champions">Şampiyonlar Ligi</button><button data-kind="nations">Uluslar Ligi</button></nav><p id="testStatus" role="status">Bir düğmeyi dene.</p><div id="pred"><div id="predictionState"></div><div id="fx"></div></div><div id="championsPred" class="hide"><div id="championsState"></div><div id="championsFixtures"></div></div><div id="nationsPred" class="hide"><div id="nationsState"></div><div id="nationsFixtures"></div></div></main>
<script>
Object.defineProperty(window,'localStorage',{value:{getItem:()=> 'preview-only'}});
const demoFixtures=[{id:1,home_team:'Galatasaray',away_team:'Barcelona'},{id:2,home_team:'Fenerbahçe',away_team:'Real Madrid'},{id:3,home_team:'Beşiktaş',away_team:'Liverpool'}];
for(const kind of ['super','champions','nations']){
const host=document.getElementById(kind==='super'?'fx':kind==='champions'?'championsFixtures':'nationsFixtures');
host.innerHTML=demoFixtures.map((f,i)=>{const h=kind==='super'?'h'+i:(kind==='champions'?'clh':'nlh')+f.id,a=kind==='super'?'a'+i:(kind==='champions'?'cla':'nla')+f.id;return '<div class="'+(kind==='super'?'m':kind==='champions'?'champions-match':'nations-match')+'"><div class="t">'+f.home_team+'</div><input id="'+h+'" inputmode="numeric" aria-label="'+kind+' '+f.id+' ev sahibi"><span>:</span><input id="'+a+'" inputmode="numeric" aria-label="'+kind+' '+f.id+' deplasman"><div class="t">'+f.away_team+'</div><button type="button" class="match-stats-button '+(kind==='nations'?'nations-stats-button':'')+'" data-match-statistics="'+f.id+'">📊 Maç İstatistikleri</button></div>'}).join('');
}
window.BizimSkorPredictionContext=()=>({week:8,fixtures:demoFixtures});
window.BizimSkorChampionsUI={currentWeek:()=>3,getFixtures:()=>demoFixtures};
window.BizimSkorNationsUI={currentWeek:()=>5,getFixtures:()=>demoFixtures};
window.BizimSkorMatchStatistics={loadSnapshot:async()=>({})};
const claims=new Set();
window.sb={rpc:async(name,args)=>{if(name==='get_robot_applied_fixture_ids')return{data:[],error:null};if(name==='claim_skorbot_preview'){const key=args.p_competition+':'+args.p_fixture_id;const used=[...claims].filter(x=>x.startsWith(args.p_competition+':')).length;if(!claims.has(key)&&used>=2)return{data:false,error:null};claims.add(key);return{data:true,error:null}}return{data:true,error:null}},from:()=>({select(){return this},eq(){return this},maybeSingle:async()=>({data:{home_score:3,away_score:2},error:null})})};
document.querySelectorAll('[data-match-statistics]').forEach(button=>button.onclick=()=>document.getElementById('testStatus').textContent='Maç istatistikleri düğmesi çalışıyor.');
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{for(const kind of ['super','champions','nations'])document.getElementById(kind==='super'?'pred':kind==='champions'?'championsPred':'nationsPred').classList.toggle('hide',kind!==button.dataset.kind);window.BizimSkorRobotUI?.decorate()});
</script><script src="../../brand-assets.js"></script><script src="../../robot-prediction-utils.js"></script><script src="../../skorbot-match-animation.js"></script><script src="../../robot-prediction-ui.js"></script></body></html>
