name: Android update bundle
on:
  push:
    branches: [android/update-v1.0.1]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run sync:android
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd mobile/android && ./gradlew bundleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bizimskor-android-unsigned-1.0.1
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
