name: Bizim Skor League Feature Tests

on:
  push:
    branches:
      - feature/invite-growth-v1
    paths:
      - 'league-system-*.js'
      - 'arena-player-card.js'
      - 'general-ranking-live-refresh.js'
      - 'champions-league-ui.js'
      - 'home-prediction-priority.js'
      - 'opportunity-match-*.js'
      - 'match-statistics-ui.js'
      - 'test/champions-week2-contract.test.js'
      - 'supabase/migrations/20260913003000_champions_league_week2.sql'
      - 'supabase/migrations/20260909190000_bizim_skor_leagues.sql'
      - 'supabase/migrations/20260909193000_bizim_skor_league_rounds.sql'
      - 'supabase/migrations/20260909200000_bizim_skor_league_memberships.sql'
      - 'supabase/migrations/20260909200200_bizim_skor_league_counts_rpc.sql'
      - 'supabase/migrations/20260909204500_bizim_skor_league_initial_seed.sql'
      - 'supabase/migrations/20260909205000_bizim_skor_league_inactivity_relegation.sql'
      - 'supabase/migrations/20260909210000_bizim_skor_league_next_period.sql'
      - 'supabase/migrations/20260909210500_bizim_skor_league_round_auto_refresh.sql'
      - 'supabase/migrations/20260909210750_bizim_skor_league_first_period_bootstrap.sql'
      - 'supabase/migrations/20260909211000_bizim_skor_league_period_automation.sql'
      - 'supabase/migrations/20260910100000_bizim_skor_league_initial_preview.sql'
      - 'supabase/migrations/20260910174500_arena_player_card_rpc.sql'
      - 'test/league-*.test.js'
      - 'test/arena-player-card.test.js'
      - 'test/general-ranking-live-refresh-league.test.js'
      - '.github/workflows/league-feature-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  league-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run league feature tests
        run: >-
          node --test
          test/champions-week2-contract.test.js
          test/arena-player-card.test.js
          test/league-system-utils.test.js
          test/league-system-ui.test.js
          test/general-ranking-live-refresh-league.test.js
          test/league-initial-normalized-seed.test.js
          test/league-next-period-database-contract.test.js
          test/league-period-automation-database-contract.test.js
          test/league-round-auto-refresh-database-contract.test.js
          test/league-round-tie-ranking.test.js
          test/league-close-eligible-ranking.test.js
          test/league-movement-plan.test.js
          test/league-counts-rpc.test.js
          test/league-migration-ownership.test.js
          test/league-first-period-bootstrap.test.js

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizim_skor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bizim_skor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: bizim_skor_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap production-shaped schema
        run: psql -v ON_ERROR_STOP=1 -f test/league-postgres-smoke-bootstrap.sql

      - name: Apply league migrations in order
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations/20260909190000_bizim_skor_leagues.sql \
            supabase/migrations/20260909193000_bizim_skor_league_rounds.sql \
            supabase/migrations/20260909200000_bizim_skor_league_memberships.sql \
            supabase/migrations/20260909200200_bizim_skor_league_counts_rpc.sql \
            supabase/migrations/20260909204500_bizim_skor_league_initial_seed.sql \
            supabase/migrations/20260909205000_bizim_skor_league_inactivity_relegation.sql \
            supabase/migrations/20260909210000_bizim_skor_league_next_period.sql \
            supabase/migrations/20260909210500_bizim_skor_league_round_auto_refresh.sql \
            supabase/migrations/20260909210750_bizim_skor_league_first_period_bootstrap.sql \
            supabase/migrations/20260909211000_bizim_skor_league_period_automation.sql \
            supabase/migrations/20260910100000_bizim_skor_league_initial_preview.sql \
            supabase/migrations/20260910174500_arena_player_card_rpc.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify key league functions exist
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_proc where pronamespace='public'::regnamespace and proname in ('initialize_first_league_period','bootstrap_first_league_period','maintain_league_periods','refresh_league_period_rounds','close_league_period','get_league_counts','get_league_initial_preview','get_arena_player_card');" | grep -x '8'
